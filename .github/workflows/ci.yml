name: ci

# pst-2sb: "render preview images", "unit tests (vitest)", and
# "e2e tests (playwright)" are required status checks on main, and
# PRs merge via the city merge-green-prs controller order — a required check that never reports
# hangs the merge forever. So this workflow must run on EVERY PR: do
# not add a workflow-level `paths:` filter here. Cheap skipping is
# decided by the `changes` job (paths-filter) and applied inside the
# render job, which still reports a conclusion when it skips the
# heavy steps.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # pst-3vp3w (CI P5; the st-2nv redesign the old in-container
    # filter step pointed at): paths-filter runs HERE, on the bare
    # runner, because inside the openscad container actions/checkout
    # runs before git exists and falls back to a REST tarball with no
    # .git — so on push (no PR listFiles API) paths-filter exited 128
    # and every merge rendered all models. Not a required check; the
    # render job consumes its outputs and renders ALL if it fails.
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # dorny/paths-filter calls listFiles on the PR to decide whether
      # models/skills/render scripts changed; without pull-requests:read
      # the API call fails with "Resource not accessible by integration".
      pull-requests: read
    outputs:
      render: ${{ steps.filter.outputs.render }}
      models_and_libs: ${{ steps.filter.outputs.models_and_libs }}
      models_and_libs_files: ${{ steps.filter.outputs.models_and_libs_files }}
      filter_ok: ${{ steps.filter.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the push-event base commit is present.
          fetch-depth: 0

      - name: Resolve push diff base
        id: base
        # Push events diff against github.event.before (the previous
        # tip of main). Fall back to HEAD~1 when it is the null SHA
        # (first push / branch creation) or no longer in history
        # (force push). Skipped on pull_request — paths-filter uses
        # the PR's listFiles API there and ignores `base`.
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "event.before unusable ('$BEFORE') — diffing against HEAD~1"
            base=$(git rev-parse HEAD~1)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.base }}
          # st-mrt: also surface the specific changed models/libs
          # files so render-all + export-all can short-circuit to
          # the touched subset. `list-files: shell` makes
          # ${{ steps.filter.outputs.models_and_libs_files }} a
          # whitespace-separated path list.
          list-files: shell
          filters: |
            render:
              - 'models/**'
              - '.claude/skills/scad-render/**'
              - '.claude/skills/_lib/**'
              - 'scripts/render-all.py'
              - 'scripts/vendor-libs.sh'
              - 'libs/README.md'
            models_and_libs:
              - 'models/*.scad'
              - 'libs/**'

  render:
    name: render preview images
    needs: changes
    # Run even when `changes` failed (then render ALL, the fail-soft
    # path) — a job skipped for a failed `needs` would report this
    # required check without rendering anything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Engine architecture (st-mb1): the container image supplies the
    # runtime environment (EGL + Qt + GL libs — the deps that made bare
    # AppImage-on-runner a bad fit, openscad/openscad #5736, #5903; see
    # st-43l), but its bundled openscad is NOT the engine we render
    # with. The "Install pinned OpenSCAD engine" step below downloads
    # the 2025.06.12.ai25773 AppImage (the st-fgp local pin), extracts
    # it (no FUSE in containers), and shadows the container binary.
    #
    # Why: dev.2025-09-06 was the closest available Docker tag to the
    # June 2025 pin (published dev tags jump 2025-05-19 → 2025-09-06),
    # but its engine exports non-watertight geometry for all 5
    # openGrid-snap models that 2025.06.12.ai25773 exports watertight
    # from identical sources (st-mb1). Same-engine-everywhere beats
    # closest-tag roulette, so the tag now only needs to provide a
    # compatible library environment — do NOT expect this image's own
    # `openscad` to be what renders below.
    container:
      image: openscad/openscad:dev.2025-09-06
    # 40 min: the pinned 2025.06 engine evaluates geometry via CGAL
    # (the dev.2025-09-06 container build that fit in 10 min appears
    # to default to the much faster Manifold backend — but that's the
    # same build that exports non-watertight geometry, st-mb1). Real
    # timings @56ded18: setup+engine install ~2.5 min, render-all
    # 18/18 models ~7 min, exports were cut off at the old 10-min
    # mark ~38s in; local container timings put the full export set
    # around 15 min. Correct-but-slower wins over fast-but-broken.
    timeout-minutes: 40
    permissions:
      contents: write
      # pst-vaiiu: the main-flavour step opens/edits the bot renders PR.
      pull-requests: write
    env:
      # pst-3vp3w: the one render gate every heavy step reads. Render
      # when `changes` saw render-relevant paths, or when `changes`
      # did not succeed (fail-soft: render everything, as before).
      RENDER_NEEDED: ${{ needs.changes.outputs.render == 'true' || needs.changes.result != 'success' }}
      # Empty ⇒ render-all/export-all default to ALL models.
      CHANGED_PATHS: ${{ needs.changes.outputs.models_and_libs_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch itself (not the merge commit) so the
          # commit-back step can push straight back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git + ca-certificates
        # st-yzo: the openscad/openscad container is minimal. git is
        # no longer needed for paths-filter (that moved to the
        # `changes` job, pst-3vp3w) but the commit-back steps below
        # clone over HTTPS, and this step's `apt-get update` primes
        # the package index for every later install.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Install pytest
        # pst-9mi: the scripts/ pytest step below runs unconditionally,
        # so its one dependency installs outside the render gate. The
        # suite imports nothing beyond pytest + stdlib; the heavy render
        # deps (numpy, trimesh, xvfb, …) stay in the gated install.
        run: |
          apt-get install -y --no-install-recommends python3-pytest \
            || python3 -m pip install --break-system-packages pytest

      - name: Scripts + invariant core unit tests
        # pst-u6t: scripts/ collects the top-level scripts/test_*.py
        # suites (prune-canonical-renders, export-all planning,
        # select-sweep-tests) in addition to scripts/invariants/.
        # pst-9mi: unconditional and early — the suite runs in <1s and
        # covers prune/export/sweep-selection logic that used to slip
        # through on scripts-only PRs when this step was gated on the
        # render paths filter (which doesn't watch most of scripts/).
        # Running before the engine install also fails fast on render
        # PRs.
        run: python3 -m pytest scripts/ -v

      - name: Install pinned OpenSCAD engine
        # st-mb1: replace the container's openscad with the exact
        # engine pinned locally (st-fgp): snapshot 2025.06.12.ai25773.
        # The container's dev.2025-09-06 build exports non-watertight
        # STLs for all 5 openGrid-snap models; this snapshot exports
        # them watertight from identical sources (verified in this
        # exact image, 2026-07-10).
        #
        # Hosting: files.openscad.org/snapshots/ retention already
        # dropped this build, so the AppImage is preserved as a release
        # asset on THIS repo (tag openscad-2025.06.12.ai25773) and
        # sha256-pinned here. Containers have no FUSE, so extract the
        # AppImage instead of running it directly; libgpg-error0 is the
        # one shared lib the AppImage needs that the image lacks. The
        # wrapper overwrites /usr/local/bin/openscad (the container
        # binary), so every later `openscad` resolves to the pin.
        env:
          APPIMAGE_URL: https://github.com/SeanOC/stuff/releases/download/openscad-2025.06.12.ai25773/OpenSCAD-2025.06.12.ai25773-x86_64.AppImage
          APPIMAGE_SHA256: cfebdf98c8545ebfcee889b75626d7c0aa5235e3e3a09aea028ee26b3c7de1fc
        run: |
          apt-get install -y --no-install-recommends curl libgpg-error0
          curl -fsSL --retry 3 -o /opt/openscad.AppImage "$APPIMAGE_URL"
          echo "$APPIMAGE_SHA256  /opt/openscad.AppImage" | sha256sum -c -
          chmod +x /opt/openscad.AppImage
          (cd /opt && ./openscad.AppImage --appimage-extract >/dev/null)
          printf '#!/bin/sh\nexec /opt/squashfs-root/AppRun "$@"\n' > /usr/local/bin/openscad
          chmod +x /usr/local/bin/openscad

      - name: openscad --version smoke
        # First thing after engine install: surface an engine mismatch
        # immediately (st-43l, st-mb1) — must print the pinned snapshot
        # version cleanly, proving the AppImage shadow took effect.
        run: |
          openscad --version
          openscad --version 2>&1 | grep -F "2025.06.12.ai25773"

      - name: Smart-render mode summary
        # st-a50: surface in the workflow summary which path the run
        # is taking so future "why did everything re-render?" goes to
        # one place instead of the per-step logs. pst-3vp3w: push and
        # PR now take the same filtered path (no push bypass).
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FILTER_RENDER: ${{ needs.changes.outputs.render }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "smart-render ($EVENT): **fallback render-all** (changes job: $CHANGES_RESULT)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FILTER_RENDER" = "true" ] && [ -n "$CHANGED_PATHS" ]; then
            echo "smart-render ($EVENT): **filtered** — render=true, models/libs subset = \`$CHANGED_PATHS\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FILTER_RENDER" = "true" ]; then
            echo "smart-render ($EVENT): **filtered → render-all** — render=true but no models/*.scad or libs/** in the diff (render tooling changed), so ALL models" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "smart-render ($EVENT): **skipped** — render=false, 0 models (no render-relevant paths changed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install python deps for measure + invariants
        if: env.RENDER_NEEDED == 'true'
        # The openscad/openscad image is Debian-based but minimal —
        # bundle only what openscad itself needs. measure.py +
        # invariants need numpy, PIL, and trimesh; rtree is trimesh's
        # optional ray-query backend required by mesh.contains() in
        # the invariants sidecars (st-3r5). `xvfb`
        # provides the `xvfb-run` wrapper that
        # .claude/skills/_lib/openscad.py invokes to drive openscad
        # headless; `xauth` is required by `xvfb-run -a` for the
        # auth-cookie dance. (git + ca-certificates are installed
        # earlier, st-yzo; pytest earlier for the
        # unconditional scripts test step, pst-9mi.)
        #
        # apt-get is preferred (deb-packaged wheels are pre-built);
        # fall back to pip with --break-system-packages if the apt
        # package isn't available in this base.
        run: |
          apt-get install -y --no-install-recommends xauth xvfb
          apt-get install -y --no-install-recommends \
            python3-numpy python3-pil python3-trimesh python3-rtree \
            || python3 -m pip install --break-system-packages \
                 numpy pillow trimesh rtree

      - name: Vendor SCAD libraries
        if: env.RENDER_NEEDED == 'true'
        run: bash scripts/vendor-libs.sh

      - name: Render all models
        if: env.RENDER_NEEDED == 'true'
        # st-mrt: pass the diff-derived models+libs file list so
        # render-all.py renders only the touched subset (a libs/
        # change still forces a full re-render). Empty string ⇒
        # render-all defaults to ALL models. CHANGED_PATHS is the
        # job-level env from needs.changes (pst-3vp3w).
        run: python3 scripts/render-all.py --changed-paths "$CHANGED_PATHS"

      - name: Export STLs + invariants
        if: env.RENDER_NEEDED == 'true'
        # The export job produces exports/<stem>.stl which the invariant
        # driver then analyzes. Either step failing is a CI failure —
        # don't keep building on a broken geometry.
        #
        # st-mrt: same --changed-paths short-circuit as the render
        # step — export-all skips unchanged models, but always runs
        # check-invariants-all on whatever exports/ already contains.
        run: |
          python3 scripts/export-all.py --changed-paths "$CHANGED_PATHS"
          python3 scripts/check-invariants-all.py

      - name: Commit regenerated renders (PRs)
        if: github.event_name == 'pull_request' && env.RENDER_NEEDED == 'true'
        # Best-effort auto-commit (st-491). openscad nightly renders
        # are non-deterministic and main is protected; the proper
        # redesign of this auto-commit-renders pipeline is filed as
        # st-fqc (P3 follow-up). For now, don't let a failure here
        # take down the rest of CI — the substance (renders, exports,
        # invariants, tests) is already green by this point. Keeps
        # st-tre/st-p7r/st-ugc diagnostic + the st-qfv fresh-clone +
        # st-tiu tree-hash skip in place so the next attempt to fix
        # this properly has the scaffolding it needs.
        continue-on-error: true
        # PR_HEAD_REF comes from github.event.pull_request.head.ref, which is
        # attacker-controllable (fork branch names). Keep it in env and only
        # pass through `git push "$PR_HEAD_REF"` — never interpolate directly
        # into a shell line.
        #
        # Workspace-clone pivot (st-qfv): the openscad/openscad container
        # mount of $GITHUB_WORKSPACE has no .git directory (st-ugc
        # diagnostic confirmed). Instead of chasing why actions/checkout
        # didn't materialize one in the container, do a fresh shallow
        # clone in /tmp, copy the regenerated renders/ over, and push
        # from there. Bypasses the workspace-mount mystery entirely.
        # Previous attempts (st-43l, st-dlw, st-ugc): apt-install git
        # in container, cd $GITHUB_WORKSPACE, safe.directory '*'. All
        # correct in isolation but they assumed a .git that doesn't
        # exist in the mount.
        # Token (pst-dm9): pushes made with GITHUB_TOKEN leave the
        # re-triggered pull_request runs stranded in action_required
        # (observed on PR #13) and the push itself cancels the in-flight
        # param sweep via concurrency. Prefer the THUMBNAIL_PUSH_TOKEN
        # repo secret (a PAT with contents:write) so re-triggered runs
        # execute normally; fall back to GITHUB_TOKEN (old behavior)
        # when the secret is absent.
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_TOKEN: ${{ secrets.THUMBNAIL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PUSH_PAT: ${{ secrets.THUMBNAIL_PUSH_TOKEN != '' }}
        run: |
          command -v git >/dev/null 2>&1 || { apt-get update && apt-get install -y --no-install-recommends git; }
          cd /tmp
          git clone --depth 1 --branch "$PR_HEAD_REF" \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo
          cd repo
          # Bring the just-rendered images over from the workspace mount.
          cp -r "$GITHUB_WORKSPACE/renders/." ./renders/
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renders/
          # Merge-base prune (pst-dm9): renders are engine-deterministic
          # but not cross-machine-deterministic, so an author's local PNG
          # for an UNCHANGED model differs byte-wise from CI's — the old
          # behavior pushed the canonical bytes back on every model PR,
          # a no-op push that cancelled sweeps and stranded checks. If a
          # regenerated PNG byte-matches the PR base (main's canonical
          # copy), drop it from the commit; post-merge the main-flavour
          # step below canonicalizes anyway. Fetch failure falls back to
          # keeping everything (old behavior).
          if [ -n "$PR_BASE_SHA" ] && git fetch --depth 1 origin "$PR_BASE_SHA"; then
            bash "$GITHUB_WORKSPACE/scripts/prune-canonical-renders.sh" "$PR_BASE_SHA"
          else
            echo "WARN: PR base SHA unavailable — keeping every regenerated render"
          fi
          # Content-aware skip (st-tiu): `git diff --cached --quiet`
          # only checks the cached patch, not the resulting tree. A
          # cp -r touches mode/mtime, so the patch is "non-empty" even
          # when every byte of every render is unchanged. Branch
          # protection rejects content-empty pushes. Compare the
          # would-be commit's tree hash to HEAD's tree instead — that's
          # the actual content check.
          new_tree=$(git write-tree)
          head_tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$new_tree" = "$head_tree" ]; then
            echo "Render tree unchanged — no commit needed."
          else
            if [ "$HAS_PUSH_PAT" != "true" ]; then
              echo "NOTE: THUMBNAIL_PUSH_TOKEN secret not set — pushing with GITHUB_TOKEN; re-triggered PR checks may strand in action_required (pst-dm9)."
            fi
            git commit -m "ci: regenerate model thumbnails"
            git push origin "HEAD:$PR_HEAD_REF"
          fi

      - name: Commit regenerated renders (main → bot PR)
        # pst-vaiiu: main is protected (5 required checks, strict), so a
        # bot commit pushed straight to main can never carry its checks
        # and was rejected with GH006 on every push since the bot's one
        # landing (3c11fb9) — masked by continue-on-error. Instead,
        # route the regenerated renders through ONE bot PR from
        # gc-pilot/ci-renders: the gc-pilot/* prefix is what the
        # codex-review-gate-stuff and merge-green-prs orders match
        # (docs/ci.md), so the PR gets its codex review and is merged
        # like any other. No continue-on-error: a failure here is now a
        # visible red step, not a silent no-op.
        #
        # Loop guard: the paths filter's render set excludes renders/**,
        # so merging the bot PR sets RENDER_NEEDED=false and skips this
        # step. The head-commit test below is defence in depth in case
        # that filter ever grows renders/**. Not an actor test — the
        # PAT and the merge controller both act as the human account,
        # so an actor guard would also skip real model merges.
        if: >-
          github.event_name == 'push' && env.RENDER_NEEDED == 'true'
          && !startsWith(github.event.head_commit.message, 'ci: regenerate model thumbnails')
        # Workspace-clone pivot (st-qfv) — see matching comment on the
        # PR-flavour step above. Same fresh-clone pattern.
        #
        # Token: THUMBNAIL_PUSH_TOKEN (contents + pull-requests write,
        # pst-1ww) does the push AND the PR create/edit, so the bot
        # PR's checks run (GITHUB_TOKEN pushes and PRs trigger no
        # workflows, pst-dm9) — and this repo has "Allow GitHub Actions
        # to create pull requests" off, so GITHUB_TOKEN cannot open the
        # PR at all. The GITHUB_TOKEN fallback only keeps the step from
        # crashing on a fork-less mirror without the secret.
        env:
          BASE: ${{ github.ref_name }}
          BOT_BRANCH: gc-pilot/ci-renders
          PUSH_TOKEN: ${{ secrets.THUMBNAIL_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PUSH_PAT: ${{ secrets.THUMBNAIL_PUSH_TOKEN != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Diagnostics (st-ugc) — keep permanent; cost is two
          # echos, saves a round trip the next time something in
          # this step misbehaves inside the container.
          echo "PWD=$PWD"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "HOME=$HOME"
          ls -la "$GITHUB_WORKSPACE/.git" 2>&1 | head -5 || echo ".git dir missing"
          if [ "$HAS_PUSH_PAT" != "true" ]; then
            echo "::warning::THUMBNAIL_PUSH_TOKEN not set — GITHUB_TOKEN can neither trigger the bot PR's checks nor (repo setting) open it (pst-vaiiu)."
          fi
          command -v git >/dev/null 2>&1 && command -v gh >/dev/null 2>&1 \
            || { apt-get update && apt-get install -y --no-install-recommends git gh; }
          export GH_TOKEN="$PUSH_TOKEN" GH_REPO="$GITHUB_REPOSITORY"

          # Models this run actually re-rendered — the same selection
          # render-all.py made from the same CHANGED_PATHS.
          fresh_stems=$(python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location(
              "render_all", os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts/render-all.py"))
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          sel = m.select_models(sorted(m.MODELS_DIR.glob("*.scad")), os.environ.get("CHANGED_PATHS"))
          print(" ".join(p.stem for p in sel or []))
          PY
          )
          echo "re-rendered this run: ${fresh_stems:-<none>}"

          cd /tmp
          git clone --depth 1 --branch "$BASE" \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo
          cd repo
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          base_sha=$(git rev-parse HEAD)
          base_short=$(git rev-parse --short HEAD)
          git checkout -q -b "$BOT_BRANCH"

          # Carry over an OPEN bot PR's renders so a second model merge
          # before it lands does not drop the first one's thumbnails:
          # the bot branch is always one commit on top of main, so its
          # own changes are BOT^..BOT. This run's fresh renders win for
          # the models it re-rendered.
          pr=$(gh pr list --head "$BOT_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          bot_tree=""
          if [ -n "$pr" ] && git fetch -q --depth 2 origin "$BOT_BRANCH"; then
            bot_tree=$(git rev-parse FETCH_HEAD:renders)
            git diff --name-only --no-renames FETCH_HEAD^ FETCH_HEAD -- renders/ | while IFS= read -r path; do
              stem=$(printf '%s' "$path" | cut -d/ -f2)
              case " $fresh_stems " in *" $stem "*) continue ;; esac
              if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
                git checkout -q FETCH_HEAD -- "$path"
              else
                git rm -q --ignore-unmatch -- "$path"
              fi
              echo "carried over from open PR #$pr: $path"
            done
          fi

          # Bring the just-rendered images over from the workspace mount.
          for stem in $fresh_stems; do
            [ -d "$GITHUB_WORKSPACE/renders/$stem" ] || continue
            mkdir -p "renders/$stem"
            cp -r "$GITHUB_WORKSPACE/renders/$stem/." "renders/$stem/"
          done
          git add renders/

          # Content-aware skip (st-tiu) — compare trees, not the cached
          # patch (cp touches mode/mtime). Unchanged vs main ⇒ no PR.
          new_tree=$(git write-tree)
          if [ "$new_tree" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "Render tree unchanged vs $BASE — no bot PR needed."
            exit 0
          fi
          # Same renders as the open bot PR already carries ⇒ leave it;
          # pr-autoupdate brings it up to date with main.
          if [ -n "$bot_tree" ] && [ "$(git rev-parse "$new_tree:renders")" = "$bot_tree" ]; then
            echo "Open bot PR #$pr already carries these renders — nothing to push."
            exit 0
          fi

          files=$(git diff --cached --name-status "$base_sha" -- renders/)
          count=$(printf '%s\n' "$files" | grep -c .)
          git commit -q -m "ci: regenerate model thumbnails" \
            -m "Regenerated renders: $count file(s) on top of $BASE@$base_short, tree $new_tree, source run $RUN_URL"
          # Force-push is confined to this bot-owned branch: it is
          # rebuilt from main every time (carry-over above keeps the
          # open PR's content).
          git push --force origin "HEAD:refs/heads/$BOT_BRANCH"

          body=$(printf '%s\n' \
            "Bot PR (pst-vaiiu): thumbnails regenerated by the push-to-main render job." \
            "" \
            "- regenerated renders: $count file(s)" \
            "- base: \`$BASE@$base_short\`, renders tree \`$(git rev-parse HEAD:renders)\`" \
            "- source run: $RUN_URL" \
            "- re-rendered this run: ${fresh_stems:-none}" \
            "" \
            "Only \`renders/**\` changes; produced by CI's own engine, so the bytes are canonical." \
            "" '```' "$files" '```')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --base "$BASE" --head "$BOT_BRANCH" \
              --title "ci: regenerate model thumbnails" --body "$body"
            pr=$(gh pr list --head "$BOT_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number')
          fi
          gh pr edit "$pr" --add-label bot-renders \
            || echo "::warning::could not label PR #$pr bot-renders (label missing?)"
          echo "bot renders PR: #$pr" | tee -a "$GITHUB_STEP_SUMMARY"

  unit:
    name: unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e tests (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pst-3vp3w (CI P6): no `needs: unit` — e2e shares nothing with the
    # vitest job, and both stay required checks on their own.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # pst-3vp3w (CI P6): no install-deps on a cache hit — the
      # ubuntu-latest image already carries chromium's system libs.
      # A miss still installs them via --with-deps.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # SCAD libraries (BOSL2, QuackWorks) are vendored by the `prebuild`
      # npm hook — scripts/vendor-libs.sh runs automatically as part of
      # `npm run build` below.
      - name: Build Next.js
        run: npm run build

      - name: Run Playwright (prod server)
        env:
          CI: "1"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
