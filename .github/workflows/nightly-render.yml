name: nightly render

# pst-3vp3w (CI P5): ci.yml now renders only the models a push/PR
# touched, so this job is the safety net — once a night it renders,
# exports and invariant-checks EVERY model with the pinned engine, then
# REPORTS drift between the fresh renders and the tracked renders/**.
#
# Drift is WARN-ONLY (exit 0): main carries a standing render diff the
# ci.yml commit-back cannot land (GH006, pst-vaiiu). The last step of
# pst-vaiiu flips the drift report to `exit 1` and records the date.
# exports/*.stl is gitignored, so STL drift cannot be diffed here —
# the invariants are the STL check. No commit-back from this workflow.
#
# Not a required check (schedule/dispatch only, never on PRs).
on:
  schedule:
    - cron: '41 8 * * *'  # 08:41 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-render
  cancel-in-progress: false

jobs:
  render-all:
    name: nightly render (all models)
    runs-on: ubuntu-latest
    # Same image + pinned engine as ci.yml's render job (st-mb1) — see
    # the comments there; keep the two in lockstep.
    container:
      image: openscad/openscad:dev.2025-09-06
    # ci.yml's full render took ~19 min (render 649 s + export 491 s)
    # plus ~2.5 min setup; same 40-min budget.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Install git + ca-certificates
        # Before checkout ON PURPOSE: actions/checkout falls back to a
        # REST tarball (no .git) when git is absent, which is why
        # ci.yml's container workspace has no .git (st-ugc). The drift
        # report below needs a real working tree.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v4

      - name: Install pinned OpenSCAD engine
        # st-mb1 — identical to ci.yml's step of the same name.
        env:
          APPIMAGE_URL: https://github.com/SeanOC/stuff/releases/download/openscad-2025.06.12.ai25773/OpenSCAD-2025.06.12.ai25773-x86_64.AppImage
          APPIMAGE_SHA256: cfebdf98c8545ebfcee889b75626d7c0aa5235e3e3a09aea028ee26b3c7de1fc
        run: |
          apt-get install -y --no-install-recommends curl libgpg-error0
          curl -fsSL --retry 3 -o /opt/openscad.AppImage "$APPIMAGE_URL"
          echo "$APPIMAGE_SHA256  /opt/openscad.AppImage" | sha256sum -c -
          chmod +x /opt/openscad.AppImage
          (cd /opt && ./openscad.AppImage --appimage-extract >/dev/null)
          printf '#!/bin/sh\nexec /opt/squashfs-root/AppRun "$@"\n' > /usr/local/bin/openscad
          chmod +x /usr/local/bin/openscad

      - name: openscad --version smoke
        run: |
          openscad --version
          openscad --version 2>&1 | grep -F "2025.06.12.ai25773"

      - name: Install python deps for measure + invariants
        # Same set as ci.yml's step of the same name.
        run: |
          apt-get install -y --no-install-recommends xauth xvfb
          apt-get install -y --no-install-recommends \
            python3-numpy python3-pil python3-trimesh python3-rtree \
            || python3 -m pip install --break-system-packages \
                 numpy pillow trimesh rtree

      - name: Vendor SCAD libraries
        run: bash scripts/vendor-libs.sh

      - name: Render all models
        # No --changed-paths ⇒ every models/*.scad.
        run: python3 scripts/render-all.py

      - name: Export STLs + invariants
        run: |
          python3 scripts/export-all.py
          python3 scripts/check-invariants-all.py

      - name: Render drift report (warn-only)
        # Runs even if export/invariants failed, as long as renders
        # exist — the drift picture is still useful.
        if: ${{ !cancelled() }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Content-aware (st-tiu): stage, then compare the would-be
          # tree to HEAD's — mode/mtime-only touches do not count.
          git add renders/
          new_tree=$(git write-tree)
          head_tree=$(git rev-parse 'HEAD^{tree}')
          porcelain=$(git status --porcelain renders/)
          count=$(printf '%s' "$porcelain" | grep -c . || true)
          {
            echo "## Render drift — renders/** vs \`$(git rev-parse --short HEAD)\`"
            echo
            echo "Warn-only until pst-vaiiu flips this to fail. STLs are gitignored and not diffed (invariants cover them)."
            echo
            echo "- HEAD tree: \`$head_tree\`"
            echo "- rendered tree: \`$new_tree\`"
            if [ "$new_tree" = "$head_tree" ]; then
              echo "- **no drift** — fresh renders byte-match the tracked renders/"
            else
              echo "- **DRIFT: $count file(s)** differ from the tracked renders/"
              echo
              echo '```'
              echo "$porcelain"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$new_tree" != "$head_tree" ]; then
            echo "::warning title=render drift::$count tracked render file(s) differ from a fresh full render (warn-only, pst-vaiiu)"
          fi
          # WARN-ONLY: pst-vaiiu replaces this with `exit 1` on drift.
          exit 0
