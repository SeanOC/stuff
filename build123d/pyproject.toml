# build123d PoC toolchain (Sean, 2026-08-30). Experiment: "manufacturing as
# code" — parametric models in Python consuming PUBLISHED libraries as deps.
# HARD RULE: mount geometry (openGrid / Multiconnect) comes ONLY from the
# opengrid library (fangpenlin, MakerRepo) or other existing build123d
# ecosystem libraries. No home-grown or SCAD-ported mount geometry.
# Exception (Sean 2026-10-01): openConnect is ported from the author's own
# CC BY 4.0 OpenSCAD (mitufy/opengrid-projects @04e2277a71c5) because no
# build123d library ships it; the port is pinned by commit and mesh-verified
# against the author's rendered plate (openconnect/ tests).
# Exception (Sean 2026-10-05): opengrid_snap/ ports QuackWorks @6123129 + patch 0001
# (CC BY-NC-SA 4.0) because no build123d library ships the positive snap; pinned
# by commit and verified against committed reference meshes.
# Exception (Sean 2026-10-05, pst-5k38j): holders/gridfinity_shelf.py and
# gridfinity/baseplate.py adapt mitufy’s Gridfinity shelf under CC BY-SA 4.0;
# the profile constants are Gridfinity Rebuilt-derived (MIT).
# holders/cartridge_holder.py carries its source design CC BY-NC-SA 4.0;
# personal/non-commercial use, see docs/provenance.md.
[project]
name = "stuff-bd"
version = "0.1.0"
description = "build123d PoC models for the stuff repo (openGrid/Multiconnect holders)"
requires-python = ">=3.13"
dependencies = [
    "build123d>=0.10.0",
    # openGrid + Multiconnect primitives (MIT, build123d-native).
    # Pinned to a commit for reproducibility (BOSL2-pin discipline).
    "opengrid",
    "trimesh>=4.0",          # GLB load + smooth normals for the thumbnail rasteriser; test mesh checks
    "shapely>=2.0",          # capped review sections
    "mapbox-earcut",         # cap polygon triangulation
    "numpy>=1.26",           # pure-numpy software thumbnail rasteriser (scripts/thumbnail.py)
    "pillow>=10.0",          # PNG encode for the thumbnail rasteriser
    "pytest>=8.0",
    "networkx>=3.7",        # section loop nesting in trimesh
    "rtree>=1.4.1",         # nested section polygon containment
]

[tool.uv.sources]
opengrid = { git = "https://makerrepo.com/r/fangpenlin/opengrid.git", rev = "eea2b4154a10d2909e5edece567cbe0563aaf955" }

[dependency-groups]
dev = [
    "pytest-regressions>=2.5",
    "pytest-split>=0.10",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
# `upstream` tests need the private reference mirror on disk (reference/FETCH.md).
# Deselected by default so PR CI stays offline; the trusted push-to-main
# reference-measure workflow runs `pytest -m upstream` (a later -m overrides this).
# pst-24tr6: bd123.yml selects its three jobs by marker (build123d/ci/README.md).
# A command-line -m REPLACES addopts, so every CI -m expression repeats
# 'and not upstream'.
markers = [
    "slow: expensive geometry contracts, opt in with --run-slow",
    "upstream: needs build123d/reference/upstream/ pulled from the private GCS mirror",
    "audit: builds a registry-sized model and runs the BRep print audit (tens of seconds each); bd123 'audit' job",
    "audit_full: cradle corner sweep (always also 'audit'); cradle-touching PRs, push to main, nightly",
    "budget: the per-model audit budget test; serial step of bd123's 'fast' job",
]
addopts = "-m 'not upstream'"
